[project]
name = "simple-strands-harness"
version = "0.1.0"
description = "Hello world Strands agent on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore>=1.23",
    "strands-agents>=1.0",
]

[dependency-groups]
# Only for deploy.py, on the machine running cdk. Left out of the runtime code zip.
dev = ["aws-cdk-lib>=2.270", "constructs>=10"]
